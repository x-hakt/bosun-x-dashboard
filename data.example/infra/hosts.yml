# Every machine the dashboard knows about. The one host with no `ssh_alias` is
# assumed to be the box the dashboard runs on (override with `local_host` in
# config.yml). Hosts with `live_monitored: true` and an `ssh_alias` are swept for
# container discovery over that SSH alias.
hosts:
  - id: home-server
    name: home-server
    role: host-node
    mesh_ip: "10.20.0.1"
    lan_ip: "192.168.10.5"
    public_ip: null
    connection: LAN · mesh VPN
    live_monitored: true

  - id: cloud-vps
    name: cloud-vps
    role: host-node
    mesh_ip: "10.20.0.2"
    lan_ip: null
    public_ip: "203.0.113.10"
    connection: mesh VPN (public endpoint)
    live_monitored: true
    ssh_alias: discovery-vps

  - id: laptop
    name: laptop
    role: workstation
    mesh_ip: "10.20.0.3"
    lan_ip: null
    public_ip: null
    connection: mesh VPN (client)
    live_monitored: false
