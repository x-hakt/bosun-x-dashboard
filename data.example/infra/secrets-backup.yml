# The fleet secrets bundle (optional). scripts/fleet-secrets-backup.sh bundles
# the paths below nightly:  tar -> zstd -> age -> <destination>/_secrets/ .
# Remove this file if you don't want it; the dashboard just hides the card.
#
# The age recipient is public. Generate the pair once:
#   age-keygen -o backup-keys/_secrets.age && chmod 600 backup-keys/_secrets.age
# put the "public key:" line here as age_recipient, and store a copy of the
# identity file in a password manager — it is excluded from every backup set.

backup_required: true
destination: nas          # id from infra/destinations.yml
keep_last: 14
age_recipient: age1exampleexampleexampleexampleexampleexampleexampleexampleex

paths:
  - ~/deploy/.env
  - ~/deploy/*/.env
  - ~/.ssh/config
  - ~/.ssh/id_ed25519
  - /etc/wireguard          # or /etc/nebula, /var/lib/tailscale, …
